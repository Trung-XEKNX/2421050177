<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đào tạo</title>

    <style>
        body {
            margin: 0;
        }
        .danh-muc {
            background-color: #2fa4e7;
        }

        .danh-sach-muc {
            padding: 0;
            margin: 0;
             /* dùng thẻ gap để tạo khoảng cách giữa các đối tượng trong ul */
            gap: 20px;
           
            /* bỏ dấu chấm ở đầu danh sách khi dùng ul,li */
            list-style: none;
            display: flex;
      
        }

        .lien-ket {
            color: white;
            /* text-decoration để bỏ gạch chân thẻ a */
            text-decoration: none;
        }
        .muc {
            padding: 20px;

}
        main {
            display: flex;
            height: 100vh;
        }

        .trai {
            /* background-color: #2fe757; */
            width: 30%;
            height: 100vh;
            /* tạo đường viền bằng border
            3 tham số: độ dày, loại đường viền, màu sắc */
            border-right: 1.5px solid #2fa4e7;
        }

        .khoi-dang-nhap {
            /* background-color: rgb(166, 163, 163); */
            width: 100%;
            height: 100%;
        }
        .khoi-thong-tin {
            width: 100%;
            padding: 10px 0;
        }

        .form {
            background-color: antiquewhite;
            width: 80%;
            margin: 10px auto;
        }

        p {
            margin: 0;
        }

        .input {
            width: 100%;
            padding: 5px 0;
        }
        .quen-mat-khau{
            display: flex;
            justify-content: flex-end;
        }
        .quen-mat-khau-lien-ket{
            color: #198cf0;
            text-decoration:  none;
        }
        button{
            width: 100%;
            padding: 5px 0;
            border-radius: 3px;
        }
        .login{
            margin-bottom: 10px;
        }
        
        .phai {
            width: 80%;
            height: 100vh;
        }
    </style>

</head>

<body>
    <!-- danh mục -->
    <nav class="danh-muc">
        <ul class="danh-sach-muc">
            <li class="muc"><a href="#" class="lien-ket">Thực tập, đồ án</a></li>
            <li class="muc"><a href="#" class="lien-ket">Thủ tục một cửa</a></li>
            <li class="muc"><a href="#" class="lien-ket">Một cửa online</a></li>
            <li class="muc"><a href="#" class="lien-ket">Email HUMG</a></li>
        </ul>
    </nav>
    <main>
        <div class="trai">
            <div class="khoi-dang-nhap">
                <form action="">
                    <div class="">
                        <p>tài khoản</p>
                        <input type="text" name="" id="">
                    </div>

                    <div class="khoi-thong-tin">
                        <p>mật khẩu</p>
                        <input type="password" name="" id="">
                    </div>
                    <div class="quen-mat-khau">
                        <a href="#" class="quen-mat-khau-lien-ket">Quên mật khẩu    </a> 
                    </div>
                    <div class="khoi-thong-tin">
                        <button>Đăng nhập</button>
                        <button>Đăng nhập với microsorf office</button>
                    </div>
                </form>
            </div>
        </div>
        <div class="phai">
            <div class="danh-sach-tin">
                <div class="tin">

                </div>
            </div>
        </div>
    </main>

</body>

</html>
