<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Bai 5</title>
    <link rel="stylesheet" href="style.css" type="text/css">
    <style>
        /* loại 2 internal style */
        h2 {
            color: red;
        }

        #tieuDe{
            color: orange;
        }
    </style>
</head>

<body>

    <!-- I. các kiểu viết style -->
    <!-- kiểu 1 viết style trong thẻ -->
    <!-- Loại 1: inline style sheet -->
    <h1 style="color:blue">HUMG</h1>

    <!-- Kiểu 2 viết ngoài thẻ ( viết ở dòng 8 ) -->
    <h2>Trường đại học Mỏ - Địa Chất</h2>

    <h3>Lớp phát triển ứng dụng Web 03</h3>

    <!-- II. Các kiểu viết selector -->
    <!-- cách 1: dùng tên thẻ  -->

    <!-- cách 2: dùng id -->
     <h2 id="tieuDe" >Trường đại học Mỏ - Địa Chất</h2>

     <!-- Cách 3: dùng class ( viết dấu . trước tên class) -->
      <h2 id="tieuDe" class="tieuDe">Trường đại học Mỏ - Địa Chất </h2>

      <h3 class="tieuDe2">lớp pt ứng dụng web</h3>
</body>

</html>
