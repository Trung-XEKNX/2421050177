<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>javascript</title>
</head>

<body>

    <!-- internal javascript -->
    <script>
        //in ra màn hình
        document.writeln("Hello world! <br>");

        //khai báo biến
        var name = "Trung dtrai <br>";

        document.writeln(name);

        name = " Trung"
        document.writeln(name);

        var year = 2026;

        document.writeln(year);

        //phép toán
        var soThuNhat = 10;
        var soThuHai = 5;
        var KetQua = 0

        //cộng 
        document.writeln("<br>Kết quả của số thứ nhất + số thứ hai là:")
        KetQua = soThuNhat + soThuHai;
        document.writeln(KetQua);

        // trừ 
        document.writeln("<br>Kết quả của số thứ nhất - số thứ hai là:")
        KetQua = soThuNhat - soThuHai;
        document.writeln(KetQua);

        //nhân
        document.writeln("<br>Kết quả của số thứ nhất * số thứ hai là:")
        KetQua = soThuNhat * soThuHai;
        document.writeln(KetQua);
        //chia
        document.writeln("<br>Kết quả của số thứ nhất / số thứ hai là:")
        KetQua = soThuNhat / soThuHai;
        document.writeln(KetQua);

        //dư
        document.writeln("<br>Kết quả của số thứ nhất % số thứ hai là:")
        KetQua = soThuNhat % soThuHai;
        document.writeln(KetQua);

        // ++
        document.writeln("<Br>");
        document.writeln(soThuNhat++);

        // +=
        soThuNhat += soThuHai;
        document.writeln(soThuNhat);

        // -=
        soThuNhat -= soThuHai;
        document.writeln(soThuNhat);

        var ho = "Nguyễn";
        document.writeln("<br>", ho + "" + name);
        document.writeln("<br>");
        document.writeln(ho.length);

        //Kiem tra kiểu dữ liệu của biến
        document.writeln(typeof (ho));
        document.writeln("<br>");
        //
        var hoVaTen = "Nguyen Quoc Trung";
        document.writeln(hoVaTen.indexOf("Q"));

        document.writeln(hoVaTen.includes("Q"));
        document.writeln("<br>");
        document.writeln(hoVaTen.startsWith("Nguyen"));
        document.writeln("<br>");

        //Thay thế kí tự
        document.writeln(hoVaTen.replace("Nguyen", "Quoc"));
        document.writeln("<br>");

        document.writeln(hoVaTen.toUpperCase());
        document.writeln("<br>");
        document.writeln(hoVaTen.toLocaleLowerCase());

        var homNay = new Date();
        document.writeln("<br>");
        document.writeln(homNay);

        var ngay = new Date("3/3/2026");
        document.writeln("<br>");
        document.writeln(ngay);

        var namNay = homNay.getFullYear();
        document.writeln("<br>");
        document.writeln(namNay);

        var thangNay = homNay.getMonth() + 1;
        document.writeln("<br>");
        document.writeln(thangNay);
        // tháng bị lùi 1 tháng vì tháng 1 hiển thị là 0

        var ngayHomNay = homNay.getDate();
        document.writeln("<br>");
        document.writeln(ngayHomNay);

        var thu = homNay.getDay() + 1;
        document.writeln("<br>");
        document.writeln(thu);

        document.writeln("<br>");
        document.writeln("Hôm nay là thứ " + thu + " ngày " + ngayHomNay + " tháng " + thangNay + " năm " + namNay);

        //mảng
        var mang = [1, 2, 3, 4, 5];
        document.writeln("<br>");
        document.writeln(mang[2]);
        document.writeln("<br>");
        document.writeln(mang.length);

        var mangTen = ["Quốc Trung", "Đăng Khoa", "Minh Hiếu"];
        document.writeln(mangTen[2]);

        var mangSo = [1, 2, 3, 4, 5, "Quốc Trung", "Đăng Khoa", "Minh Hiếu"];
        document.writeln(mangSo[5]);

        var d = mang.concat(mangSo, mangTen);
        document.writeln("<br>");
        document.write(d.pop());

        document.writeln("<br>");
        d.push("gay");
        document.write(d);

        document.writeln("<br>");
        document.write(mangSo.reverse());

        //object
        var thongTinSinhVien = {
            ten: "Nguyễn Quốc Trung",
            namSinh: 2006,
            queQuan: {
                tinh: " Phú Thọ",
                phuong: "nông trang"
            }
        };
        document.write(thongTinSinhVien.queQuan.tinh);

        tuoi = namNay - thongTinSinhVien.namSinh;
        thongTinSinhVien.tuoi = tuoi;
        // console.log(thongTinSinhVien);
        // boollean: true nam/ false nữ
        thongTinSinhVien.gioiTinh = true;

        var danhSach = [
            {
                ten: "Nguyễn Đăng Khoa",
                namSinh: 2006,
                queQuan: {
                    tinh: "Hà Nội",
                    phuong: "Thiên Lộc"
                }
            },
            {
                ten: "Nguyễn Minh Hiếu",
                namSinh: 2006,
                queQuan: {
                    tinh: "Hà Nội",
                    phuong: "Cổ Nhuế"
                }
            }
        ];
        document.writeln("<br>");
        console.log(danhSach);

        // == != > < 
        /// so sanh cả giá trị và kiểu dữ liệu
        var so1 = 10;
        var so2 = "10";
        document.writeln("<br>");
        document.writeln(so1 === so2);


        // && ||
        document.writeln("<br>");
        if(thu >= 6){
            document.writeln("cuối tuần");
        }else{
            document.writeln(" đi học");
        }
        document.writeln("<br>");
        var so = 5;
        if (so % 2 == 0){
            document.writeln("so chan");
        }
        else{
            document.writeln("So le");
        }
    </script>
    <script src="script.js"></script>
</body>

</html>
